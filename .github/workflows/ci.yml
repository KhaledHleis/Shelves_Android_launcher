name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7-stable"

jobs:
  godot:
    name: Godot — import and self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin && cd ~/godot-bin
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot
          chmod +x godot

      - name: Import assets
        # First import writes .godot/; it is expected to be slow and noisy.
        run: ~/godot-bin/godot --headless --import --path godot

      - name: Self-test
        # Exits non-zero if any navigation check fails.
        run: ~/godot-bin/godot --headless --path godot tools/selftest.tscn | tee run.log

      - name: Fail on script errors
        run: |
          if grep -q "SCRIPT ERROR" run.log; then
            echo "::error::GDScript errors during the run"
            grep -n "SCRIPT ERROR" -A4 run.log
            exit 1
          fi

  plugin:
    name: Android plugin — assemble AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        working-directory: android-plugin
        run: gradle assemble --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-plugin-aar
          path: godot/addons/socket_launcher/bin/**/*.aar
          if-no-files-found: error
